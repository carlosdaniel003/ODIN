name: Display F3 UNKNOWN OFF and technical debug tests

on:
  push:
    branches:
      - display
  workflow_dispatch:

jobs:
  display-f3-unknown-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install opencv-python-headless numpy gpiozero

      - name: Compile F3 UNKNOWN and debug modules
        run: |
          python -m py_compile \
            src/platform/display_f3_unknown_debug_fix.py \
            src/platform/display_f3_live_diagnostic_trace.py \
            src/platform/display_f3_debug_toggle.py \
            src/platform/display_f3_heavy_executor.py \
            src/platform/display_f3_analysis_service.py \
            src/platform/display_f3_manual_snapshot_debug.py \
            src/platform/display_f3_snapshot_debug_lightweight_ui.py \
            src/platform/display_f3_reference_mask_save_fix.py \
            src/platform/display_f3_responsive_config.py \
            src/platform/display_f3_workspace_ui.py \
            src/platform/display_f3_h1_single_frame_probe.py \
            src/platform/display_f3_probe_rearm_guard.py \
            src/platform/display_f3_probe_visual_sync.py \
            src/platform/display_f3_powered_cycle_latch.py \
            src/platform/display_f3_physical_status_memory.py \
            src/platform/display_f3_current_check_status_sync.py \
            src/platform/display_f3_final_check_stability.py \
            src/platform/display_f3_single_frame_approval.py \
            src/platform/display_f3_runtime_contract_fix.py \
            src/platform/display_f3_fast_expected_gate.py \
            src/platform/display_f3_runtime_performance_guard.py \
            src/platform/display_f3_zero_cost_debug_runtime.py \
            src/platform/display_f3_final_performance.py \
            src/platform/display_f3_reference_preview_rotation.py \
            src/platform/display_f3_physical_powered_gate.py \
            src/platform/display_f3_power_deadlock_fix.py \
            tests/test_display_f3_unknown_debug_fix.py \
            tests/test_display_f3_live_diagnostic_trace.py \
            tests/test_display_f3_debug_toggle.py \
            tests/test_display_f3_heavy_executor.py \
            tests/test_display_f3_manual_analysis_stage2.py \
            tests/test_display_f3_manual_snapshot_debug.py \
            tests/test_display_f3_snapshot_debug_lightweight_ui.py \
            tests/test_display_f3_reference_mask_save_fix.py \
            tests/test_display_f3_responsive_config.py \
            tests/test_display_f3_workspace_ui.py \
            tests/test_display_f3_h1_single_frame_probe.py \
            tests/test_display_f3_probe_rearm_guard.py \
            tests/test_display_f3_probe_visual_sync.py \
            tests/test_display_f3_powered_cycle_latch.py \
            tests/test_display_f3_physical_status_memory.py \
            tests/test_display_f3_current_check_status_sync.py \
            tests/test_display_f3_final_check_stability.py \
            tests/test_display_f3_single_frame_approval.py \
            tests/test_display_f3_runtime_contract_fix.py \
            tests/test_display_f3_runtime_performance_guard.py \
            tests/test_display_f3_zero_cost_debug_runtime.py \
            tests/test_display_f3_final_performance.py \
            tests/test_display_f3_reference_preview_rotation.py \
            tests/test_display_f3_physical_powered_gate.py \
            tests/test_display_f3_power_deadlock_fix.py

      - name: Validate F3 heavy executor
        run: |
          python -m unittest \
            tests.test_display_f3_heavy_executor \
            -v

      - name: Validate F3 manual analysis stage 2
        run: |
          python -m unittest \
            tests.test_display_f3_manual_analysis_stage2 \
            -v

      - name: Run focused regressions
        run: |
          python -m unittest \
            tests.test_display_f3_unknown_debug_fix \
            tests.test_display_f3_live_diagnostic_trace \
            tests.test_display_f3_debug_toggle \
            tests.test_display_f3_manual_snapshot_debug \
            tests.test_display_f3_snapshot_debug_lightweight_ui \
            tests.test_display_f3_reference_mask_save_fix \
            tests.test_display_f3_responsive_config \
            tests.test_display_f3_workspace_ui \
            tests.test_display_f3_h1_single_frame_probe \
            tests.test_display_f3_probe_rearm_guard \
            tests.test_display_f3_probe_visual_sync \
            tests.test_display_f3_powered_cycle_latch \
            tests.test_display_f3_physical_status_memory \
            tests.test_display_f3_current_check_status_sync \
            tests.test_display_f3_final_check_stability \
            tests.test_display_f3_single_frame_approval \
            tests.test_display_f3_runtime_contract_fix \
            tests.test_display_f3_runtime_performance_guard \
            tests.test_display_f3_zero_cost_debug_runtime \
            tests.test_display_f3_final_performance \
            tests.test_display_f3_reference_preview_rotation \
            tests.test_display_f3_physical_powered_gate \
            tests.test_display_f3_power_deadlock_fix \
            tests.test_display_f3_fast_expected_gate \
            tests.test_display_f3_physical_learning_policy \
            tests.test_display_f3_exact_check_template \
            -v
