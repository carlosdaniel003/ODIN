name: Display CHECK presence reference tests

on:
  push:
    branches:
      - display
  workflow_dispatch:

jobs:
  display-check-presence-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 6

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install opencv-python-headless numpy gpiozero

      - name: Compile presence reference modules
        run: |
          python -m py_compile \
            src/platform/display_project_config.py \
            src/platform/display_f3_heavy_executor.py \
            src/platform/display_f3_config_service.py \
            src/platform/display_check_presence_reference.py \
            src/platform/display_visual_reference_status.py \
            src/platform/display_reference_roi.py \
            src/platform/display_f3_status_layout_fix.py \
            src/platform/display_f3_operational_status.py \
            src/platform/display_f3_runtime_authorities.py \
            src/platform/display_f3_check_transition_guard.py \
            src/platform/display_f3_physical_state_fix.py \
            src/platform/display_f3_live_runtime_fix.py \
            src/platform/display_f3_mask_status.py \
            src/platform/display_live_roi_overlay.py \
            src/platform/raspberry_pi3_production_app.py \
            tests/test_display_project_config_scroll.py \
            tests/test_display_f3_config_architecture.py \
            tests/test_display_f3_config_open_smoke.py \
            tests/test_display_check_presence_reference.py \
            tests/test_display_visual_reference_status.py \
            tests/test_display_reference_roi.py \
            tests/test_display_f3_status_layout_fix.py \
            tests/test_display_f3_operational_status.py \
            tests/test_display_f3_runtime_authorities.py \
            tests/test_display_f3_check_transition_guard.py \
            tests/test_display_f3_physical_state_fix.py \
            tests/test_display_f3_live_runtime_fix.py \
            tests/test_display_f3_mask_status.py

      - name: Run Project Display scroll tests
        run: |
          python -m unittest \
            tests.test_display_project_config_scroll \
            -v

      - name: Run Display F3 configuration architecture tests
        run: |
          python -m unittest \
            tests.test_display_f3_config_architecture \
            -v

      - name: Smoke test real Display F3 configuration window
        run: |
          xvfb-run -a python -m unittest \
            tests.test_display_f3_config_open_smoke \
            -v

      - name: Run F3 fixed status layout tests
        run: |
          python -m unittest \
            tests.test_display_f3_status_layout_fix \
            -v

      - name: Run F3 operational status tests
        run: |
          python -m unittest \
            tests.test_display_f3_operational_status \
            -v

      - name: Validate F3 runtime authority ownership
        run: |
          python -m unittest \
            tests.test_display_f3_runtime_authorities \
            -v

      - name: Run F3 check transition guard tests
        run: |
          python -m unittest \
            tests.test_display_f3_check_transition_guard \
            -v

      - name: Run F3 physical state and persistent ROI tests
        run: |
          python -m unittest \
            tests.test_display_f3_physical_state_fix \
            -v

      - name: Run F3 live ROI and transient check tests
        run: |
          python -m unittest \
            tests.test_display_f3_live_runtime_fix \
            -v

      - name: Run F3 mask diagnostic status tests
        run: |
          python -m unittest \
            tests.test_display_f3_mask_status \
            -v

      - name: Run F3 reference ROI tests
        run: |
          python -m unittest \
            tests.test_display_reference_roi \
            -v

      - name: Run presence reference tests
        run: |
          python -m unittest \
            tests.test_display_check_presence_reference \
            tests.test_display_visual_reference_status \
            -v
