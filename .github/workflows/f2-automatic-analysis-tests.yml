name: F2 automatic analysis tests

on:
  push:
    branches:
      - display
  workflow_dispatch:

jobs:
  f2-automatic-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install opencv-python-headless numpy

      - name: Compile F2 automatic modules
        run: |
          python -m py_compile \
            src/core/f2_led_physical_guard.py \
            src/core/operation_engine.py \
            src/platform/f2_automatic_analysis.py \
            src/platform/f2_automatic_cycle_guard.py \
            src/platform/f2_automatic_presence_cycle_policy.py \
            src/platform/f2_board_presence_references.py \
            src/platform/f2_board_status_display.py \
            src/platform/segment_display_runtime.py \
            src/platform/segment_display_operation_window.py \
            src/platform/desktop_production_app.py \
            tests/test_f2_automatic_analysis.py \
            tests/test_f2_automatic_cycle_guard.py \
            tests/test_f2_board_presence_cycle.py \
            tests/test_f2_board_presence_references.py \
            tests/test_f2_led_physical_guard.py \
            tests/test_f2_presence_rearm_policy.py \
            tests/test_f2_strong_on_reconciliation.py

      - name: Run F2 automatic analysis tests
        run: |
          python -m unittest \
            tests.test_f2_automatic_analysis \
            tests.test_f2_automatic_cycle_guard \
            tests.test_f2_board_presence_cycle \
            tests.test_f2_board_presence_references \
            tests.test_f2_led_physical_guard \
            tests.test_f2_presence_rearm_policy \
            tests.test_f2_strong_on_reconciliation \
            tests.test_operation_confirmation \
            tests.test_segment_operation_preview \
            tests.test_linux_f2_fixed_resolution \
            -v

      - name: Keep F3 isolation covered
        run: |
          python -m unittest \
            tests.test_display_f3_architecture \
            tests.test_display_f3_live_roi_overlay \
            tests.test_display_f3_auto_check \
            -v
