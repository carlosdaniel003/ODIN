name: Display F3 board reference fallback tests

on:
  push:
    branches: [display]
  pull_request:
    branches: [display]

jobs:
  display-f3-board-reference-fallback:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install opencv-python-headless numpy

      - name: Compile physical classifier and regressions
        run: |
          python -m py_compile \
            src/platform/display_f3_check_transition_guard.py \
            src/platform/display_f3_exact_physical_board_fallback.py \
            tests/test_display_f3_board_reference_relative_fallback.py \
            tests/test_display_f3_exact_physical_board_fallback.py

      - name: Run OFF and EMPTY physical regressions
        run: |
          python -m unittest \
            tests.test_display_f3_board_reference_relative_fallback \
            tests.test_display_f3_exact_physical_board_fallback \
            tests.test_display_f3_check_transition_guard \
            -v
