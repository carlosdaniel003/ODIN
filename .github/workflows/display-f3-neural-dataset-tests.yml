name: Display F3 neural dataset tests

on:
  push:
    branches:
      - display
      - display-tracking-on
  workflow_dispatch:

jobs:
  display-f3-neural-dataset:
    runs-on: ubuntu-latest
    timeout-minutes: 6

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install opencv-python-headless numpy Pillow

      - name: Compile neural dataset, runtime and training pipeline
        run: |
          python -m py_compile \
            src/platform/display_f3_neural_dataset.py \
            src/platform/display_f3_neural_physical_calibration.py \
            src/platform/display_f3_neural_runtime.py \
            src/platform/display_auto_check_policy.py \
            src/platform/display_auto_check_runtime.py \
            src/platform/display_f3_runtime_authorities.py \
            src/platform/display_f3_contour_check_identity.py \
            src/platform/display_f3_live_diagnostic_trace.py \
            src/platform/display_f3_powered_cycle_latch.py \
            scripts/treinar_f3_segmentos_neural.py \
            tests/test_display_f3_neural_dataset.py \
            tests/test_display_f3_neural_runtime.py \
            tests/test_display_f3_same_mask_reference_fix.py \
            tests/test_display_f3_real_snapshots.py \
            scripts/avaliar_f3_fotos_reais.py \
            tests/test_display_f3_neural_training.py \
            tests/test_display_f3_debug_clarity_fix.py

      - name: Verify direct training CLI import path
        run: |
          python scripts/treinar_f3_segmentos_neural.py --help

      - name: Run neural F3 tests
        run: |
          python -m unittest \
            tests.test_display_f3_neural_dataset \
            tests.test_display_f3_neural_runtime \
            tests.test_display_f3_same_mask_reference_fix \
            tests.test_display_f3_real_snapshots \
            tests.test_display_f3_neural_training \
            tests.test_display_f3_debug_clarity_fix \
            -v

      - name: Report actual F3 camera snapshots (diagnostic only)
        if: always()
        run: |
          python scripts/avaliar_f3_fotos_reais.py --report f3_snapshot_diagnostic.json

      - name: Archive F3 physical snapshot diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f3-real-snapshots-report
          path: f3_snapshot_diagnostic.json
          if-no-files-found: warn

      - name: Archive public F3 replay source and six actual PNG fixtures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f3-replay-source-and-photos
          path: |
            src/
            scripts/avaliar_f3_fotos_reais.py
            tests/fixtures/display_f3/CM_500_L/
          if-no-files-found: error
