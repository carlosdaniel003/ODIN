name: Camera manual controls tests

on:
  push:
    branches:
      - display
  workflow_dispatch:

jobs:
  manual-camera-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install opencv-python-headless numpy

      - name: Compile camera live modules
        run: |
          python -m py_compile \
            src/platform/camera_selection.py \
            src/platform/responsive_camera_selection.py \
            src/platform/responsive_camera_selection_installer.py \
            src/platform/camera_live_control_service.py \
            src/platform/live_fixed_full_hd_camera_service.py \
            src/platform/camera_live_settings.py \
            src/ui/main_window_parts/settings/camera_live_ui_behavior.py \
            tests/test_responsive_camera_selection.py

      - name: Test manual restore and live settings
        run: |
          python -m unittest \
            tests.test_camera_manual_restore \
            tests.test_camera_live_settings \
            tests.test_camera_selection \
            tests.test_responsive_camera_selection \
            -v
