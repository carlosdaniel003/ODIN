name: Camera screenshot tests

on:
  push:
    branches:
      - display
  workflow_dispatch:

jobs:
  screenshot-camera:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install opencv-python-headless numpy
      - name: Compile screenshot modules
        run: |
          python -m py_compile \
            src/platform/camera_screenshot.py \
            src/ui/main_window_parts/panels/criar_painel_principal.py \
            src/ui/main_window_parts/updates/atualizar_estado_tela_ao_vivo.py
      - name: Test screenshot behavior
        run: python -m unittest tests.test_camera_screenshot -v
