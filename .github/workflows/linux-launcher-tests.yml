name: Linux launcher tests

on:
  push:
    branches:
      - display
  workflow_dispatch:

jobs:
  linux-launcher:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate launcher
        run: |
          test -f scripts/iniciar_odin_linux.sh
          test -x scripts/iniciar_odin_linux.sh
          bash -n scripts/iniciar_odin_linux.sh
          grep -q 'main_rpi.py' scripts/iniciar_odin_linux.sh
          python -m py_compile \
            config.py \
            main_rpi.py \
            linux_local_config_bootstrap.py \
            src/platform/display_f3_runtime_coordinator.py \
            tests/test_linux_local_config_bootstrap.py \
            tests/test_display_f3_runtime_coordinator.py

      - name: Keep JIG config outside Git checkout
        run: |
          python -m unittest tests.test_linux_local_config_bootstrap -v

      - name: Validate F3 runtime coordinator
        run: |
          python -m unittest tests.test_display_f3_runtime_coordinator -v
