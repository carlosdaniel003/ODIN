name: Linux launcher tests

on:
  push:
    branches:
      - display
  workflow_dispatch:

jobs:
  linux-launcher:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate launcher
        run: |
          test -f scripts/iniciar_odin_linux.sh
          test -x scripts/iniciar_odin_linux.sh
          bash -n scripts/iniciar_odin_linux.sh
          grep -q 'main.py' scripts/iniciar_odin_linux.sh
          python -m py_compile \
            config.py \
            main.py \
            main_desktop.py \
            linux_local_config_bootstrap.py \
            src/platform/desktop_settings.py \
            src/platform/desktop_camera_service.py \
            src/platform/desktop_profile.py \
            src/platform/desktop_base_app.py \
            src/platform/desktop_production_app.py \
            src/platform/display_f3_runtime_coordinator.py \
            tests/test_linux_local_config_bootstrap.py \
            tests/test_display_f3_runtime_coordinator.py

      - name: Validate desktop composition
        run: |
          python -m unittest tests.test_desktop_composition -v

      - name: Audit legacy platform residues
        run: |
          python -m unittest tests.test_platform_legacy_residue -v

      - name: Audit orphan patch modules
        run: |
          python -m unittest tests.test_orphan_patch_residue -v

      - name: Keep JIG config outside Git checkout
        run: |
          python -m unittest tests.test_linux_local_config_bootstrap -v

      - name: Validate F3 runtime coordinator
        run: |
          python -m unittest tests.test_display_f3_runtime_coordinator -v
