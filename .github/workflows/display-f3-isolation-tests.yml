            tests.test_display_f3_manual_snapshot_debug.DisplayF3ManualSnapshotDebugTests.test_relatorio_inclui_metricas_d025_sem_serializar_imagem \
            tests.test_display_f3_snapshot_debug_lightweight_ui.DisplayF3SnapshotDebugLightweightUiTests.test_visual_d025_e_apenas_apresentacao_de_png_precomputado \
            tests.test_display_f3_snapshot_debug_lightweight_ui.DisplayF3SnapshotDebugLightweightUiTests.test_janela_debug_usa_print_e_visual_d025_ja_precomputado \
            tests.test_display_f3_snapshot_debug_lightweight_ui.DisplayF3SnapshotDebugLightweightUiTests.test_print_do_debug_respeita_area_real_do_preview \
            -v

      - name: Run luminous F3 tracking regressions
        run: |
          python -m unittest \
            tests.test_display_f3_object_tracking_isolation.F3ObjectTrackingIsolationTests.test_luminous_rescue_permanece_no_espaco_canonico \
            tests.test_display_f3_object_tracking_isolation.F3ObjectTrackingIsolationTests.test_luminous_refinement_guard_rejects_large_twist \
            tests.test_display_f3_object_tracking_isolation.F3ObjectTrackingIsolationTests.test_luminous_tracking_uses_canonical_mask_geometry \
            tests.test_display_f3_object_tracking_isolation.F3ObjectTrackingIsolationTests.test_live_geometry_uses_canonical_shape_without_check_local_warp \
            tests.test_display_f3_object_tracking_isolation.F3ObjectTrackingIsolationTests.test_tracking_preview_uses_classic_luminous_mask_presentation \
            tests.test_display_f3_live_roi_overlay.DisplayF3LiveRoiOverlayTests.test_preview_operacional_classico_so_pinta_luz_em_verde \
            tests.test_display_f3_live_roi_overlay.DisplayF3LiveRoiOverlayTests.test_visor_luminoso_so_mostra_segmentos_identificados_com_luz \
            tests.test_display_f3_object_tracking_isolation.F3ObjectTrackingIsolationTests.test_tracking_worker_preserva_token_do_snapshot_mesmo_se_camera_avanca \
            tests.test_display_f3_object_tracking_isolation.F3ObjectTrackingIsolationTests.test_semantic_worker_preserva_raw_e_geometria_do_mesmo_tracking_snapshot \
            tests.test_display_f3_object_tracking_isolation.F3ObjectTrackingIsolationTests.test_intermittent_semantic_snapshot_survives_next_off_phase_within_hold \
            tests.test_display_f3_object_tracking_isolation.F3ObjectTrackingIsolationTests.test_intermittent_snapshot_does_not_relax_steady_or_long_stale_frame \
            tests.test_display_f3_object_tracking_isolation.F3ObjectTrackingIsolationTests.test_intermittent_tracking_snapshot_can_launch_semantic_after_live_frame_advanced \
            tests.test_display_f3_runtime_authorities.DisplayF3RuntimeAuthoritiesTests.test_usb_power_gate_aceita_lock_luminoso_atual_do_mesmo_check \
            tests.test_display_f3_runtime_authorities.DisplayF3RuntimeAuthoritiesTests.test_lock_luminoso_stale_ou_de_outro_check_nao_libera_gate \
            tests.test_display_f3_contour_check_identity.DisplayF3ContourCheckIdentityTests.test_analisador_rastreado_aceita_snapshot_explicito_sem_estado_mutavel_do_app \
