name: Display F3 isolation tests

on:
  push:
    branches:
      - display
  workflow_dispatch:

jobs:
  display-f3-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install opencv-python-headless numpy gpiozero

      - name: Compile F3 isolation modules
        run: |
          python -m py_compile \
            src/platform/display_production_f3.py \
            src/platform/display_production_f3_window.py \
            src/platform/display_check_sequence_runtime.py \
            src/platform/display_auto_check_analyzer.py \
            src/platform/display_auto_check_policy.py \
            src/platform/display_auto_check_runtime.py \
            src/platform/display_live_roi_overlay.py \
            src/platform/display_manual_transition_guard.py \
            src/platform/display_result_feedback.py \
            src/platform/display_editor_performance.py \
            src/platform/display_visual_rotation.py \
            src/platform/display_project_repository.py \
            src/platform/display_project_config.py \
            src/platform/display_mask_editor.py \
            src/platform/display_mask_geometry.py \
            src/platform/display_mask_editor_interactions.py \
            src/platform/display_check_editor.py \
            src/platform/display_check_zoom.py \
            src/platform/display_reference_store.py \
            src/platform/display_reference_learning.py \
            src/platform/display_reference_learning_guard.py \
            src/platform/display_f3_reference_authority_fix.py \
            src/platform/display_f3_reference_authority_bridge.py \
            src/platform/display_f3_same_mask_reference_fix.py \
            src/platform/display_f3_physical_learning_policy.py \
            src/platform/display_f3_exact_check_template.py \
            src/platform/display_f3_object_tracking.py \
            src/platform/display_f3_tracking_orientation_ui.py \
            src/platform/display_f3_reference_geometry_editor.py \
            src/platform/display_f3_mask_editor_reference.py \
            src/platform/freeform_segment_persistence.py \
            src/platform/segment_project_geometry_persistence.py \
            src/platform/raspberry_pi3_production_app.py \
            tests/test_display_f3_architecture.py \
            tests/test_display_f3_phase2_architecture.py \
            tests/test_display_f3_phase3_architecture.py \
            tests/test_display_project_repository.py \
            tests/test_display_check_repository.py \
            tests/test_display_mask_editor_f2_parity.py \
            tests/test_roi_geometry_f2_f3_consistency.py \
            tests/test_freeform_project_roundtrip.py \
            tests/test_display_check_zoom.py \
            tests/test_display_f3_visual_rotation.py \
            tests/test_display_check_visual_rotation.py \
            tests/test_display_f3_check_sequence_runtime.py \
            tests/test_display_reference_learning.py \
            tests/test_display_f3_auto_check.py \
            tests/test_display_f3_optional_low_light.py \
            tests/test_display_f3_auto_check_policy.py \
            tests/test_display_f3_live_roi_overlay.py \
            tests/test_display_f3_transient_bluetooth.py \
            tests/test_display_f3_h1_to_bluetooth_gate.py \
            tests/test_display_f3_strict_manual_transition_gate.py \
            tests/test_display_f3_result_feedback.py \
            tests/test_display_f3_editor_performance.py \
            tests/test_display_f3_reference_authority_fix.py \
            tests/test_display_f3_same_mask_reference_fix.py \
            tests/test_display_f3_physical_learning_policy.py \
            tests/test_display_f3_exact_check_template.py \
            tests/test_display_f3_object_tracking_isolation.py \
            tests/test_display_f3_tracking_ui_contract.py \
            tests/test_display_f3_geometry_adjustments.py

      - name: Run ROI geometry parity tests
        run: |
          python -m unittest \
            tests.test_display_mask_editor_f2_parity \
            tests.test_roi_geometry_f2_f3_consistency \
            tests.test_freeform_segment_roi \
            tests.test_freeform_project_roundtrip \
            -v

      - name: Run F3 object tracking tests
        run: |
          python -m unittest \
            tests.test_display_f3_object_tracking_isolation \
            tests.test_display_f3_tracking_ui_contract \
            tests.test_display_f3_geometry_adjustments \
            -v

      - name: Run F3 isolation and runtime tests
        run: |
          python -m unittest \
            tests.test_display_f3_architecture \
            tests.test_display_f3_phase2_architecture \
            tests.test_display_f3_phase3_architecture \
            tests.test_display_project_repository \
            tests.test_display_check_repository \
            tests.test_display_mask_editor_f2_parity \
            tests.test_display_check_zoom \
            tests.test_display_f3_visual_rotation \
            tests.test_display_check_visual_rotation \
            tests.test_display_f3_check_sequence_runtime \
            tests.test_display_reference_learning \
            tests.test_display_f3_auto_check \
            tests.test_display_f3_optional_low_light \
            tests.test_display_f3_auto_check_policy \
            tests.test_display_f3_live_roi_overlay \
            tests.test_display_f3_transient_bluetooth \
            tests.test_display_f3_h1_to_bluetooth_gate \
            tests.test_display_f3_strict_manual_transition_gate \
            tests.test_display_f3_result_feedback \
            tests.test_display_f3_editor_performance \
            tests.test_display_f3_reference_authority_fix \
            tests.test_display_f3_same_mask_reference_fix \
            tests.test_display_f3_physical_learning_policy \
            tests.test_display_f3_exact_check_template \
            -v

      - name: Run F2 regression tests
        run: |
          python -m unittest \
            tests.test_operation_confirmation \
            tests.test_segment_operation_preview \
            tests.test_project_master_resolution \
            tests.test_project_master_resolution_guard \
            tests.test_neutral_project_startup \
            tests.test_linux_f2_fixed_resolution \
            -v
