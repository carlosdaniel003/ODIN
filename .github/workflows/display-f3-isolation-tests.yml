name: Display F3 isolation tests

on:
  push:
    branches:
      - display
  workflow_dispatch:

jobs:
  display-f3-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install opencv-python-headless numpy

      - name: Compile F3 isolation modules
        run: |
          python -m py_compile \
            src/platform/display_production_f3.py \
            src/platform/display_production_f3_window.py \
            src/platform/display_check_sequence_runtime.py \
            src/platform/display_auto_check_analyzer.py \
            src/platform/display_auto_check_policy.py \
            src/platform/display_auto_check_runtime.py \
            src/platform/display_live_roi_overlay.py \
            src/platform/display_manual_transition_guard.py \
            src/platform/display_result_feedback.py \
            src/platform/display_editor_performance.py \
            src/platform/display_visual_rotation.py \
            src/platform/display_project_repository.py \
            src/platform/display_project_config.py \
            src/platform/display_mask_editor.py \
            src/platform/display_mask_geometry.py \
            src/platform/display_mask_editor_interactions.py \
            src/platform/display_check_editor.py \
            src/platform/display_check_zoom.py \
            src/platform/display_reference_store.py \
            src/platform/display_reference_learning.py \
            src/platform/display_reference_learning_guard.py \
            src/platform/display_f3_reference_authority_fix.py \
            src/platform/display_f3_reference_authority_bridge.py \
            src/platform/display_f3_same_mask_reference_fix.py \
            src/platform/display_f3_physical_learning_policy.py \
            src/platform/display_f3_exact_check_template.py \
            src/platform/display_f3_contour_check_identity.py \
            src/platform/display_f3_object_tracking.py \
            src/platform/display_f3_h1_registration.py \
            src/platform/display_f3_tracking_orientation_ui.py \
            src/platform/display_f3_reference_geometry_editor.py \
            src/platform/display_f3_mask_editor_reference.py \
            src/platform/display_f3_preview_clarity_fix.py \
            src/platform/freeform_segment_persistence.py \
            src/platform/segment_project_geometry_persistence.py \
            src/platform/desktop_production_app.py \
            tests/test_display_f3_architecture.py \
            tests/test_display_f3_phase2_architecture.py \
            tests/test_display_f3_phase3_architecture.py \
            tests/test_display_project_repository.py \
            tests/test_display_check_repository.py \
            tests/test_display_mask_editor_f2_parity.py \
            tests/test_roi_geometry_f2_f3_consistency.py \
            tests/test_freeform_project_roundtrip.py \
            tests/test_display_check_zoom.py \
            tests/test_display_f3_visual_rotation.py \
            tests/test_display_check_visual_rotation.py \
            tests/test_display_f3_check_sequence_runtime.py \
            tests/test_display_reference_learning.py \
            tests/test_display_f3_auto_check.py \
            tests/test_display_f3_optional_low_light.py \
            tests/test_display_f3_auto_check_policy.py \
            tests/test_display_f3_live_roi_overlay.py \
            tests/test_display_f3_transient_bluetooth.py \
            tests/test_display_f3_h1_to_bluetooth_gate.py \
            tests/test_display_f3_strict_manual_transition_gate.py \
            tests/test_display_f3_result_feedback.py \
            tests/test_display_f3_editor_performance.py \
            tests/test_display_f3_reference_authority_fix.py \
            tests/test_display_f3_same_mask_reference_fix.py \
            tests/test_display_f3_physical_learning_policy.py \
            tests/test_display_f3_exact_check_template.py \
            tests/test_display_f3_contour_check_identity.py \
            tests/test_display_f3_object_tracking_isolation.py \
            tests/test_display_f3_h1_registration.py \
            tests/test_display_f3_tracking_ui_contract.py \
            tests/test_display_f3_geometry_adjustments.py

      - name: Run D-025 homography H1 experiment tests
        run: |
          python -m unittest \
            tests.test_display_f3_h1_registration \
            -v

      - name: Run D-025 diagnostic presentation regressions
        run: |
          python -m unittest \
            tests.test_display_f3_manual_snapshot_debug.DisplayF3ManualSnapshotDebugTests.test_tracking_geometry_snapshot_preserva_contorno_do_filtro_para_d025 \
            tests.test_display_f3_manual_snapshot_debug.DisplayF3ManualSnapshotDebugTests.test_debug_d025_usa_foto_h1_real_e_frame_congelado_sem_autoridade_produtiva \
            tests.test_display_f3_manual_snapshot_debug.DisplayF3ManualSnapshotDebugTests.test_relatorio_inclui_metricas_d025_sem_serializar_imagem \
            tests.test_display_f3_snapshot_debug_lightweight_ui.DisplayF3SnapshotDebugLightweightUiTests.test_visual_d025_e_apenas_apresentacao_de_png_precomputado \
            tests.test_display_f3_snapshot_debug_lightweight_ui.DisplayF3SnapshotDebugLightweightUiTests.test_janela_debug_usa_print_e_visual_d025_ja_precomputado \
            tests.test_display_f3_snapshot_debug_lightweight_ui.DisplayF3SnapshotDebugLightweightUiTests.test_print_do_debug_respeita_area_real_do_preview \
            -v

      - name: Run luminous F3 tracking regressions
        run: |
          python -m unittest \
            tests.test_display_f3_object_tracking_isolation.F3ObjectTrackingIsolationTests.test_luminous_rescue_permanece_no_espaco_canonico \
            tests.test_display_f3_object_tracking_isolation.F3ObjectTrackingIsolationTests.test_luminous_refinement_guard_rejects_large_twist \
            tests.test_display_f3_object_tracking_isolation.F3ObjectTrackingIsolationTests.test_luminous_tracking_uses_canonical_mask_geometry \
            tests.test_display_f3_object_tracking_isolation.F3ObjectTrackingIsolationTests.test_live_geometry_uses_canonical_shape_without_check_local_warp \
            tests.test_display_f3_object_tracking_isolation.F3ObjectTrackingIsolationTests.test_tracking_preview_uses_classic_luminous_mask_presentation \
            tests.test_display_f3_live_roi_overlay.DisplayF3LiveRoiOverlayTests.test_preview_operacional_classico_so_pinta_luz_em_verde \
            tests.test_display_f3_live_roi_overlay.DisplayF3LiveRoiOverlayTests.test_visor_luminoso_so_mostra_segmentos_identificados_com_luz \
            tests.test_display_f3_object_tracking_isolation.F3ObjectTrackingIsolationTests.test_tracking_worker_preserva_token_do_snapshot_mesmo_se_camera_avanca \
            tests.test_display_f3_object_tracking_isolation.F3ObjectTrackingIsolationTests.test_semantic_worker_preserva_raw_e_geometria_do_mesmo_tracking_snapshot \
            tests.test_display_f3_object_tracking_isolation.F3ObjectTrackingIsolationTests.test_intermittent_semantic_snapshot_survives_next_off_phase_within_hold \
            tests.test_display_f3_object_tracking_isolation.F3ObjectTrackingIsolationTests.test_intermittent_snapshot_does_not_relax_steady_or_long_stale_frame \
            tests.test_display_f3_object_tracking_isolation.F3ObjectTrackingIsolationTests.test_intermittent_tracking_snapshot_can_launch_semantic_after_live_frame_advanced \
            tests.test_display_f3_contour_check_identity.DisplayF3ContourCheckIdentityTests.test_analisador_rastreado_aceita_snapshot_explicito_sem_estado_mutavel_do_app \
            tests.test_display_f3_contour_check_identity.DisplayF3ContourCheckIdentityTests.test_emissao_no_nucleo_exato_promove_on_sem_aprovar_mascara_off_errada \
            tests.test_display_f3_contour_check_identity.DisplayF3ContourCheckIdentityTests.test_evidencia_luminosa_nao_promove_on_sem_lock_do_mesmo_check \
            tests.test_display_f3_object_tracking_isolation.F3ObjectTrackingIsolationTests.test_base_pose_with_light_inside_exact_on_masks_becomes_luminous_lock_without_motion \
            tests.test_display_f3_object_tracking_isolation.F3ObjectTrackingIsolationTests.test_fine_fit_ignores_unsupported_or_distant_landmarks \
            tests.test_display_f3_object_tracking_isolation.F3ObjectTrackingIsolationTests.test_fine_fit_rejects_high_residual_even_when_it_improves_coarse \
            tests.test_display_f3_object_tracking_isolation.F3ObjectTrackingIsolationTests.test_luminous_rescue_is_vetoed_when_power_is_explicitly_off \
            tests.test_display_f3_object_tracking_isolation.F3ObjectTrackingIsolationTests.test_three_id_anchored_segments_refine_coarse_pose \
            tests.test_display_f3_object_tracking_isolation.F3ObjectTrackingIsolationTests.test_structural_lock_accepts_three_segment_fine_alignment \
            tests.test_display_f3_object_tracking_isolation.F3ObjectTrackingIsolationTests.test_luminous_segments_refine_pose_inside_moving_filter \
            tests.test_display_f3_object_tracking_isolation.F3ObjectTrackingIsolationTests.test_luminous_grid_survives_missing_expected_on_and_extra_light \
            tests.test_display_f3_object_tracking_isolation.F3ObjectTrackingIsolationTests.test_luminous_blooming_recovers_expected_on_landmarks_with_structural_lock \
            tests.test_display_f3_object_tracking_isolation.F3ObjectTrackingIsolationTests.test_luminous_fit_diagnostics_explain_coarse_failure \
            tests.test_display_f3_object_tracking_isolation.F3ObjectTrackingIsolationTests.test_luminous_grid_failure_preserves_observed_components_in_telemetry \
            tests.test_display_f3_object_tracking_isolation.F3ObjectTrackingIsolationTests.test_dark_filter_without_emission_does_not_search_off_segments \
            tests.test_display_f3_object_tracking_isolation.F3ObjectTrackingIsolationTests.test_live_tracking_calls_luminous_refinement_after_structural_attempt \
            -v

      - name: Run ROI geometry parity tests
        run: |
          python -m unittest \
            tests.test_display_mask_editor_f2_parity \
            tests.test_roi_geometry_f2_f3_consistency \
            tests.test_freeform_segment_roi \
            tests.test_freeform_project_roundtrip \
            -v

      - name: Run F3 object tracking tests
        run: |
          python -m unittest \
            tests.test_display_f3_object_tracking_isolation \
            tests.test_display_f3_tracking_ui_contract \
            tests.test_display_f3_geometry_adjustments \
            -v

      - name: Run F3 isolation and runtime tests
        run: |
          python -m unittest \
            tests.test_display_f3_architecture \
            tests.test_display_f3_phase2_architecture \
            tests.test_display_f3_phase3_architecture \
            tests.test_display_project_repository \
            tests.test_display_check_repository \
            tests.test_display_mask_editor_f2_parity \
            tests.test_display_check_zoom \
            tests.test_display_f3_visual_rotation \
            tests.test_display_check_visual_rotation \
            tests.test_display_f3_check_sequence_runtime \
            tests.test_display_reference_learning \
            tests.test_display_f3_auto_check \
            tests.test_display_f3_optional_low_light \
            tests.test_display_f3_auto_check_policy \
            tests.test_display_f3_live_roi_overlay \
            tests.test_display_f3_transient_bluetooth \
            tests.test_display_f3_h1_to_bluetooth_gate \
            tests.test_display_f3_strict_manual_transition_gate \
            tests.test_display_f3_result_feedback \
            tests.test_display_f3_editor_performance \
            tests.test_display_f3_reference_authority_fix \
            tests.test_display_f3_same_mask_reference_fix \
            tests.test_display_f3_physical_learning_policy \
            tests.test_display_f3_exact_check_template \
            -v

      - name: Run F2 regression tests
        run: |
          python -m unittest \
            tests.test_operation_confirmation \
            tests.test_segment_operation_preview \
            tests.test_project_master_resolution \
            tests.test_project_master_resolution_guard \
            tests.test_neutral_project_startup \
            tests.test_linux_f2_fixed_resolution \
            -v
