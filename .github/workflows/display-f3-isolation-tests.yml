            tests/test_display_f3_runtime_authorities.py \
            tests/test_display_f3_object_tracking_isolation.py \
            tests/test_display_f3_h1_registration.py \
            tests/test_display_f3_status_layout_fix.py \
            tests/test_display_f3_tracking_ui_contract.py \
            tests/test_display_f3_geometry_adjustments.py

      - name: Run D-025 homography H1 experiment tests
        run: |
          python -m unittest \
            tests.test_display_f3_h1_registration \
            -v

      - name: Run D-025 diagnostic presentation regressions
        run: |
          python -m unittest \
            tests.test_display_f3_manual_snapshot_debug.DisplayF3ManualSnapshotDebugTests.test_tracking_geometry_snapshot_preserva_contorno_do_filtro_para_d025 \
