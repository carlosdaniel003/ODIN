name: Windows camera handoff tests

on:
  push:
    branches:
      - display
  workflow_dispatch:

jobs:
  windows-camera-handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install opencv-python-headless numpy

      - name: Compile Windows handoff modules
        run: |
          python -m py_compile \
            src/platform/windows_camera_debug.py \
            src/platform/windows_camera_handoff.py \
            src/platform/camera_selection.py \
            src/platform/responsive_camera_selection.py \
            src/platform/windows_camera_compatibility.py \
            src/platform/live_fixed_full_hd_camera_service.py \
            src/platform/neutral_project_startup.py \
            src/platform/desktop_production_app.py

      - name: Run Windows handoff regressions
        run: |
          python -m unittest \
            tests.test_windows_camera_debug \
            tests.test_windows_camera_handoff \
            tests.test_windows_camera_resolution \
            tests.test_neutral_project_startup \
            tests.test_responsive_camera_selection \
            tests.test_linux_camera_compatibility \
            tests.test_project_master_resolution
