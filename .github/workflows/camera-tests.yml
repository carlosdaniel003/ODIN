name: Camera stability tests

on:
  push:
    branches:
      - display
  workflow_dispatch:

jobs:
  camera-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install opencv-python-headless numpy

      - name: Compile changed camera, display and ROI modules
        run: |
          python -m py_compile \
            src/core/roi_geometry.py \
            src/core/feature_extractor.py \
            src/core/operation_engine.py \
            src/core/segment_low_light.py \
            src/core/debug_formatter.py \
            src/core/visual_renderer.py \
            src/infra/result_repository.py \
            src/models/led_selection.py \
            src/models/analysis_result.py \
            src/platform/threaded_camera_service.py \
            src/platform/fixed_full_hd_camera_service.py \
            src/platform/linux_camera_compatibility.py \
            src/platform/windows_camera_compatibility.py \
            src/platform/live_fixed_full_hd_camera_service.py \
            src/platform/camera_selection.py \
            src/platform/camera_live_settings.py \
            src/platform/analysis_response_metrics.py \
            src/platform/native_resolution_config.py \
            src/platform/led_mask_resolution_sync.py \
            src/platform/fixed_mask_geometry_guard.py \
            src/platform/mask_resolution_legacy_reference.py \
            src/platform/project_master_resolution.py \
            src/platform/bulk_roi_editor.py \
            src/platform/area_roi_editor.py \
            src/platform/area_roi_editor_v2.py \
            src/platform/area_roi_editor_v3.py \
            src/platform/area_roi_editor_v4.py \
            src/platform/rotated_roi_editor.py \
            src/platform/rotated_preview_roi_editor.py \
            src/platform/freeform_segment_roi.py \
            src/platform/freeform_segment_persistence.py \
            src/platform/mass_roi_selection_tool.py \
            src/platform/responsive_led_selection_toolbar.py \
            src/platform/segment_display_roi_editor.py \
            src/platform/segment_display_runtime.py \
            src/platform/segment_project_geometry_persistence.py \
            src/platform/segment_display_operation_window.py \
            src/platform/reference_capture.py \
            src/platform/reference_project_store.py \
            src/platform/reference_project_sets.py \
            src/platform/reference_debug_context.py \
            src/platform/led_project_preview.py \
            src/platform/led_project_preview_store.py \
            src/platform/fullscreen_led_selection.py \
            src/platform/display_awake_runtime.py \
            src/platform/display_theme.py \
            src/platform/desktop_production_app.py \
            src/ui/main_window.py \
            src/ui/main_window_parts/settings/abrir_janela_configuracoes_interativa.py \
            src/ui/main_window_parts/settings/abrir_janela_configuracoes_ao_vivo.py \
            src/ui/main_window_parts/settings/camera_runtime_profile_ui.py \
            src/ui/main_window_parts/layout/criar_barra_metadados.py \
            src/ui/main_window_parts/layout/criar_area_dashboard.py \
            src/ui/main_window_parts/panels/criar_painel_principal.py \
            src/ui/main_window_parts/panels/criar_painel_central.py \
            src/ui/main_window_parts/panels/criar_painel_direito.py \
            src/ui/main_window_parts/panels/criar_tabela_inferior.py \
            src/ui/main_window_parts/image/rotacao_visual_principal.py \
            src/ui/main_window_parts/image/selection_zoom.py \
            src/ui/main_window_parts/image/atualizar_imagem_principal_redimensionada.py \
            src/ui/main_window_parts/image/converter_canvas_para_imagem_original.py \
            src/ui/main_window_parts/image/fullscreen_image_viewer.py \
            src/ui/main_window_parts/image/exibir_imagem_em_canvas.py \
            src/ui/main_window_parts/image/preparar_imagem_para_exibicao.py \
            src/ui/main_window_parts/magnifier/atualizar_lupa_canvas.py \
            src/ui/main_window_parts/magnifier/desenhar_lupa_canvas.py \
            src/ui/main_window_parts/canvas/desenhar_canvas.py \
            src/ui/main_window_parts/canvas/roi_shape_canvas.py \
            src/ui/main_window_parts/canvas/desenhar_resultado_led.py \
            src/ui/main_window_parts/canvas/desenhar_led_selecionado.py \
            src/ui/main_window_parts/canvas/desenhar_guias_leds_camera.py \
            src/ui/main_window_parts/updates/atualizar_estado_selecao_led.py \
            src/ui/main_window_parts/updates/atualizar_metricas_desempenho.py \
            src/ui/main_window_parts/updates/atualizar_faixa_resultado_multiplos.py \
            src/ui/main_window_parts/updates/atualizar_painel_resultado_multiplos.py \
            src/ui/main_window_parts/updates/exibir_renderizacoes_visuais.py \
            src/ui/main_window_parts/updates/limpar_renderizacoes_visuais.py \
            src/ui/main_window_parts/lifecycle/init_view.py \
            src/ui/main_window_parts/lifecycle/alternar_tela_cheia.py \
            src/ui/main_window_parts/lifecycle/sair_tela_cheia.py

      - name: Run fixed camera, display and ROI tests
        run: |
          python -m unittest \
            tests.test_native_resolution_camera \
            tests.test_linux_camera_compatibility \
            tests.test_windows_camera_resolution \
            tests.test_project_master_resolution \
            tests.test_threaded_backend_switch \
            tests.test_linux_camera_backend \
            tests.test_v4l2_controls \
            tests.test_frame_integrity \
            tests.test_camera_stability_runtime \
            tests.test_camera_selection \
            tests.test_camera_live_settings \
            tests.test_analysis_response_metrics \
            tests.test_led_mask_resolution_sync \
            tests.test_display_awake_runtime \
            tests.test_fullscreen_native \
            tests.test_bulk_roi_editor \
            tests.test_area_roi_editor \
            tests.test_area_roi_keyboard \
            tests.test_rotated_roi_editor \
            tests.test_rotated_magnifier \
            tests.test_auxiliary_image_rotation \
            tests.test_fixed_mask_geometry_guard \
            tests.test_fullscreen_led_selection \
            tests.test_fullscreen_selection_zoom \
            tests.test_freeform_segment_roi \
            tests.test_mass_roi_selection_tool \
            tests.test_responsive_led_selection_toolbar \
            tests.test_reference_project_sets \
            tests.test_reference_debug_and_dashboard_layout \
            tests.test_led_project_preview \
            tests.test_selection_zoom \
            tests.test_fullscreen_image_viewer \
            tests.test_main_image_rotation \
            tests.test_display_theme \
            tests.test_segment_roi \
            tests.test_segment_runtime_persistence \
            tests.test_segment_project_persistence \
            tests.test_segment_operation_preview \
            tests.test_segment_low_light \
            -v
