name: Project master resolution tests

on:
  push:
    branches:
      - display
  workflow_dispatch:

jobs:
  project-master-resolution:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install opencv-python-headless numpy

      - name: Compile master resolution modules
        run: |
          python -m py_compile \
            src/platform/led_project_repository.py \
            src/platform/project_master_resolution.py \
            src/platform/project_master_resolution_guard.py \
            src/platform/project_mask_geometry_anchor.py \
            src/platform/linux_f2_fixed_resolution.py \
            src/platform/live_fixed_full_hd_camera_service.py \
            src/platform/linux_camera_compatibility.py \
            src/platform/windows_camera_compatibility.py \
            src/platform/desktop_production_app.py \
            tests/test_project_mask_geometry_anchor.py \
            tests/test_linux_f2_fixed_resolution.py

      - name: Run master resolution tests
        run: |
          python -m unittest \
            tests.test_project_master_resolution \
            tests.test_project_master_resolution_guard \
            tests.test_project_master_resolution_service_guard \
            tests.test_project_mask_geometry_anchor \
            tests.test_linux_f2_fixed_resolution \
            tests.test_led_mask_resolution_sync \
            tests.test_fixed_mask_geometry_guard \
            tests.test_segment_project_persistence \
            tests.test_display_f3_architecture \
            tests.test_display_f3_phase2_architecture \
            -v
