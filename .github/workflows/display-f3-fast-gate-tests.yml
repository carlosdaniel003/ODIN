name: Display F3 fast H1 BLUE tests

on:
  push:
    branches:
      - display
  workflow_dispatch:

jobs:
  display-f3-fast-h1-blue:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install opencv-python-headless numpy

      - name: Compile fast gate
        run: |
          python -m py_compile \
            src/platform/display_f3_fast_expected_gate.py \
            src/platform/display_f3_h1_single_frame_probe.py \
            src/platform/display_f3_single_frame_approval.py \
            src/platform/display_f3_final_check_stability.py \
            src/platform/display_f3_physical_transition_authority.py \
            src/platform/display_f3_live_diagnostic_trace.py \
            src/platform/display_f3_probe_visual_sync.py \
            src/platform/display_f3_powered_cycle_latch.py \
            src/platform/display_f3_runtime_contract_fix.py \
            src/platform/display_f3_zoom.py \
            src/platform/display_project_repository.py \
            src/platform/display_project_config.py \
            src/platform/display_production_f3.py \
            src/platform/display_f3_runtime_coordinator.py \
            src/platform/desktop_production_app.py \
            tests/test_display_f3_fast_expected_gate.py \
            tests/test_display_f3_h1_single_frame_probe.py \
            tests/test_display_f3_single_frame_approval.py \
            tests/test_display_f3_final_check_stability.py \
            tests/test_display_f3_physical_transition_authority.py \
            tests/test_display_f3_live_diagnostic_trace.py \
            tests/test_display_f3_probe_visual_sync.py \
            tests/test_display_f3_powered_cycle_latch.py \
            tests/test_display_f3_auto_check.py \
            tests/test_display_f3_power_authority.py \
            tests/test_display_f3_live_runtime_fix.py \
            tests/test_display_f3_runtime_contract_fix.py \
            tests/test_display_f3_zoom.py \
            tests/test_display_f3_config_architecture.py \
            tests/test_display_f3_runtime_coordinator.py \
            tests/test_display_project_repository.py \
            tests/test_display_f3_config_open_smoke.py

      - name: Validate first-ON judgment gate
        run: |
          python -m unittest \
            tests.test_display_f3_auto_check.DisplayF3AutoCheckTests.test_ui_h1_nao_julga_mascaras_antes_do_primeiro_expected_on \
            tests.test_display_f3_auto_check.DisplayF3AutoCheckTests.test_ui_h1_libera_ok_ng_apos_primeiro_expected_on_confirmado \
            -v

      - name: Validate blocked-gate neutral presentation
        run: |
          python -m unittest \
            tests.test_display_f3_power_authority.DisplayF3PowerAuthorityTests.test_gate_bloqueado_preserva_bruto_no_debug_e_publica_ui_neutra \
            tests.test_display_f3_power_authority.DisplayF3PowerAuthorityTests.test_preview_explica_energia_confirmada_aguardando_alinhamento \
            tests.test_display_f3_power_authority.DisplayF3PowerAuthorityTests.test_debug_nao_diz_check_liberado_quando_alinhamento_bloqueia \
            tests.test_display_f3_live_runtime_fix.DisplayF3LiveRuntimeFixTests.test_overlay_fica_neutro_quando_runtime_esta_sem_autoridade \
            -v

      - name: Validate one-frame CHECK approval contract
        run: |
          python -m unittest \
            tests.test_display_f3_single_frame_approval \
            tests.test_display_f3_h1_single_frame_probe.DisplayF3H1SingleFrameProbeTests.test_h1_first_check_needs_one_positive_frame \
            tests.test_display_f3_h1_single_frame_probe.DisplayF3H1SingleFrameProbeTests.test_h1_confirma_primeira_aprovacao_completa \
            tests.test_display_f3_auto_check.DisplayF3AutoCheckTests.test_runtime_approves_on_first_fully_conforming_frame \
            tests.test_display_f3_final_check_stability.DisplayF3FinalCheckStabilityTests.test_future_check_registers_on_first_fully_approved_frame \
            tests.test_display_f3_physical_transition_authority.DisplayF3PhysicalTransitionAuthorityTests.test_h1_28_de_28_confirma_mesmo_se_contorno_ainda_prefere_aux \
            tests.test_display_f3_physical_transition_authority.DisplayF3PhysicalTransitionAuthorityTests.test_h1_27_de_28_nao_bypassa_identidade_do_contorno \
            tests.test_display_f3_physical_transition_authority.DisplayF3PhysicalTransitionAuthorityTests.test_blue_28_de_28_confirma_transicao_mesmo_se_foto_nao_prefere_blue \
            tests.test_display_f3_physical_transition_authority.DisplayF3PhysicalTransitionAuthorityTests.test_blue_27_de_28_continua_dependendo_da_transicao_fisica \
            tests.test_display_f3_physical_transition_authority.DisplayF3PhysicalTransitionAuthorityTests.test_28_de_28_nao_prova_transicao_se_checks_sao_semanticamente_iguais \
            tests.test_display_f3_physical_transition_authority.DisplayF3PhysicalTransitionAuthorityTests.test_blue_ng_27_de_28_confirma_chegada_por_assinatura_das_mascaras \
            tests.test_display_f3_physical_transition_authority.DisplayF3PhysicalTransitionAuthorityTests.test_blue_ng_nao_confirma_chegada_se_assinatura_ainda_e_h1 \
            tests.test_display_f3_physical_transition_authority.DisplayF3PhysicalTransitionAuthorityTests.test_result_guard_permite_ng_depois_da_assinatura_confirmar_blue \
            -v

      - name: Validate canonical CHECK analyzer ownership
        run: |
          python -m unittest \
            tests.test_display_f3_live_diagnostic_trace.DisplayF3LiveDiagnosticTraceTests.test_h1_probe_confirms_on_first_positive_frame \
            tests.test_display_f3_live_diagnostic_trace.DisplayF3LiveDiagnosticTraceTests.test_canonical_runtime_reuses_core_analysis_when_latest_frame_advanced \
            tests.test_display_f3_live_diagnostic_trace.DisplayF3LiveDiagnosticTraceTests.test_canonical_runtime_makes_exact_probe_observer_only \
            tests.test_display_f3_probe_visual_sync.DisplayF3ProbeVisualSyncTests.test_canonical_runtime_preserves_tracked_analysis_instead_of_probe \
            tests.test_display_f3_powered_cycle_latch.DisplayF3PoweredCycleLatchTests.test_runtime_canonico_desativa_bridge_de_decisao_da_sonda \
            -v

      - name: Run fast H1 BLUE tests
        run: |
          python -m unittest \
            tests.test_display_f3_fast_expected_gate \
            tests.test_display_f3_transient_bluetooth \
            tests.test_display_f3_h1_to_bluetooth_gate \
            tests.test_display_f3_strict_manual_transition_gate \
            tests.test_display_f3_exact_check_template \
            tests.test_display_f3_h1_single_frame_probe \
            tests.test_display_f3_runtime_contract_fix \
            -v

      - name: Validate zoom framing and live preview contracts
        run: |
          python -m unittest \
            tests.test_display_f3_zoom \
            tests.test_display_f3_config_architecture.DisplayF3ConfigArchitectureTests.test_configuracao_zoom_tem_preview_final_e_viewport_arrastavel \
            tests.test_display_f3_config_architecture.DisplayF3ConfigArchitectureTests.test_preview_de_zoom_reutiliza_scheduler_sem_criar_timer_proprio \
            tests.test_display_f3_runtime_coordinator.DisplayF3RuntimeCoordinatorTests.test_runtime_frame_transformado_e_usado_e_frame_bruto_e_restaurado \
            tests.test_display_project_repository.DisplayProjectRepositoryTests.test_zoom_f3_e_persistido_por_projeto_e_preservado_ao_salvar_mascaras \
            -v

      - name: Smoke test real Configurar F3
        run: |
          xvfb-run -a python -m unittest \
            tests.test_display_f3_config_open_smoke \
            -v
