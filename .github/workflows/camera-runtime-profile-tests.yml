name: Camera runtime profile tests

on:
  push:
    branches:
      - display
  workflow_dispatch:

jobs:
  runtime-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install opencv-python-headless numpy

      - name: Compile runtime camera modules
        run: |
          python -m py_compile \
            src/platform/camera_live_control_service.py \
            src/platform/verified_live_camera_service.py \
            src/platform/live_fixed_full_hd_camera_service.py \
            src/platform/camera_live_settings.py \
            src/ui/main_window_parts/settings/camera_runtime_profile_ui.py

      - name: Run runtime camera tests
        run: |
          python -m unittest \
            tests.test_camera_runtime_profile_and_support \
            tests.test_camera_live_settings \
            tests.test_camera_manual_restore \
            -v
